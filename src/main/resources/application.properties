spring.application.name=Calendario
server.port=${SERVER_PORT:8081}

spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:calendar_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&rewriteBatchedStatements=true&cachePrepStmts=true&prepStmtCacheSize=250&prepStmtCacheSqlLimit=2048
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:1234}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Pool: la app es de solo lectura salvo el poblado, no hace falta un pool grande
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=2

spring.jpa.hibernate.ddl-auto=update
# Sin open-in-view la conexion se libera al salir del servicio, no al serializar la respuesta
spring.jpa.open-in-view=false

# Inserts/updates por lotes: el poblado de la BD escribe cientos de miles de filas
spring.jpa.properties.hibernate.jdbc.batch_size=500
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.batch_versioned_data=true
# Las consultas del calendario devuelven listas grandes: merece la pena subir el fetch size
spring.jpa.properties.hibernate.jdbc.fetch_size=500
spring.jpa.properties.hibernate.query.in_clause_parameter_padding=true


logging.level.CCASolutions.Calendario=INFO

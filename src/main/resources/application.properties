spring.application.name=Calendario
server.port=8081

spring.datasource.url=jdbc:mysql://localhost:3306/calendar_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update

# --- Usuarios ---
# Clave HMAC (Base64, >= 32 bytes) con la que se firman los JWT. En produccion
# debe venir de la variable de entorno VAU_JWT_SECRETO; el valor por defecto
# solo sirve para desarrollo.
vau.jwt.secreto=${VAU_JWT_SECRETO:Nqd48H48VVdIk/P7E5wLHbRAWYT9ct0rlm2yo2eaFWdxM1teNyfdVxydE/IpCMPP}
vau.jwt.minutos-sesion=120
vau.jwt.minutos-recuperacion=10
# Origenes que pueden llamar a /api/usuarios (el resto de la API sigue abierta).
vau.cors.origenes-usuarios=http://localhost:4200
# Mantenimiento diario de estados de usuario (03:00).
vau.usuarios.cron=0 0 3 * * *

# =============================================================================
# EN: Calendario - application configuration.
#     Every credential and tuning value can be overridden with an environment
#     variable; the defaults are the ones the project was already using, so an
#     existing local setup keeps working untouched.
# ES: Calendario - configuracion de la aplicacion.
#     Todas las credenciales y valores de ajuste se pueden sobrescribir con una
#     variable de entorno; los valores por defecto son los que ya usaba el proyecto,
#     asi que una instalacion local existente sigue funcionando sin tocar nada.
# =============================================================================

spring.application.name=Calendario
server.port=${SERVER_PORT:8081}

# -----------------------------------------------------------------------------
# EN: Database. The credentials used to be hard-coded in this file, which means
#     they travel in the jar and in git history. They are now placeholders with the
#     previous values as fallback, so you can export DB_PASSWORD instead.
# ES: Base de datos. Las credenciales estaban escritas a mano en este fichero, lo que
#     significa que viajan en el jar y en el historial de git. Ahora son marcadores con
#     los valores anteriores como respaldo, de modo que puedes exportar DB_PASSWORD.
# -----------------------------------------------------------------------------
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:calendar_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&rewriteBatchedStatements=true&cachePrepStmts=true&prepStmtCacheSize=250&prepStmtCacheSqlLimit=2048&useServerPrepStmts=true
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:1234}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# -----------------------------------------------------------------------------
# EN: Connection pool. The read path now holds a single connection for the whole
#     conversion instead of taking one per repository call, so a small pool is
#     enough - and a small pool that is never exhausted beats a large idle one.
# ES: Pool de conexiones. El camino de lectura mantiene ahora una sola conexion para
#     toda la conversion en lugar de coger una por llamada al repositorio, asi que un
#     pool pequeno basta - y un pool pequeno que nunca se agota es mejor que uno grande
#     desocupado.
# -----------------------------------------------------------------------------
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:10}
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.pool-name=CalendarioPool

# EN: Must stay paired with hibernate.connection.provider_disables_autocommit below.
#     The pool hands out connections with autocommit already off, which lets Hibernate
#     defer acquiring a connection until it really needs one and saves a round trip
#     per transaction. Setting the Hibernate flag without this one makes every commit
#     fail, so never change one without the other.
# ES: Debe ir siempre emparejado con hibernate.connection.provider_disables_autocommit
#     de mas abajo. El pool entrega conexiones con autocommit ya desactivado, lo que
#     permite a Hibernate retrasar la obtencion de una conexion hasta que de verdad la
#     necesita y ahorra un viaje por transaccion. Poner el flag de Hibernate sin este
#     hace que falle cada commit, asi que nunca cambies uno sin el otro.
spring.datasource.hikari.auto-commit=false

# -----------------------------------------------------------------------------
# EN: JPA / Hibernate.
#
#     ddl-auto=update is kept because it is what creates the new indexes declared on
#     the entities. Once they exist, switching it to "validate" makes startup faster
#     and stops schema changes from happening by accident.
#
#     open-in-view=false closes the persistence session when the service method
#     returns instead of keeping it open until the response has been serialised. It
#     was on by default, and Spring logs a warning about it on every startup.
#
#     The fetch size tells the driver how many rows to bring per round trip; the
#     default of one row at a time is the wrong choice for the date-range queries
#     this application lives on.
#
# ES: JPA / Hibernate.
#
#     Se mantiene ddl-auto=update porque es lo que crea los nuevos indices declarados en
#     las entidades. Una vez existan, cambiarlo a "validate" acelera el arranque y evita
#     que el esquema cambie por accidente.
#
#     open-in-view=false cierra la sesion de persistencia cuando el metodo de servicio
#     retorna, en lugar de mantenerla abierta hasta que se ha serializado la respuesta.
#     Estaba activado por defecto, y Spring avisa de ello en cada arranque.
#
#     El tamano de lote indica al driver cuantas filas traer por viaje; el valor por
#     defecto de una fila cada vez es la eleccion equivocada para las consultas por rango
#     de fechas de las que vive esta aplicacion.
# -----------------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.fetch_size=200
spring.jpa.properties.hibernate.jdbc.batch_size=100
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.query.in_clause_parameter_padding=true
spring.jpa.properties.hibernate.query.plan_cache_max_size=512
spring.jpa.properties.hibernate.connection.provider_disables_autocommit=true

# -----------------------------------------------------------------------------
# EN: Cache of converted dates. The conversion of a given day never changes until
#     the calendar is regenerated, so the only limits needed are on memory.
# ES: Cache de fechas convertidas. La conversion de un dia dado no cambia hasta que se
#     regenera el calendario, asi que los unicos limites necesarios son de memoria.
# -----------------------------------------------------------------------------
calendario.cache.max-fechas=${CACHE_MAX_FECHAS:5000}
calendario.cache.horas-sin-uso=${CACHE_HORAS_SIN_USO:24}

# -----------------------------------------------------------------------------
# EN: Initial administrator password, applied only to an empty database.
# ES: Contrasena inicial de administrador, solo se aplica a una base de datos vacia.
# -----------------------------------------------------------------------------
calendario.admin.password-inicial=${ADMIN_PASSWORD:admintest}

# -----------------------------------------------------------------------------
# EN: Logging. Set the application level to DEBUG to see why a date could not be
#     converted, and uncomment the SQL lines when tuning a query.
# ES: Registro. Pon el nivel de la aplicacion en DEBUG para ver por que no se ha podido
#     convertir una fecha, y descomenta las lineas de SQL cuando ajustes una consulta.
# -----------------------------------------------------------------------------
logging.level.CCASolutions.Calendario=${LOG_LEVEL:INFO}
